<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Suivi</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;600&display=swap');
:root{font-family:'IBM Plex Sans',sans-serif;color:#17263D;background:#F4F0E9}*{box-sizing:border-box}body{width:360px;margin:0;padding:22px 22px 20px}.brand{display:flex;align-items:center;gap:9px;font:24px 'DM Serif Display';margin-bottom:28px}.brand-mark{width:25px;height:25px;border:5px solid #E45B45;border-top-color:transparent;border-bottom-color:transparent;border-radius:7px}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#E45B45;font-weight:600;margin:0 0 9px}.title{font:32px/1 'DM Serif Display';margin:0 0 18px}.detect{background:#FBF9F5;padding:16px;margin-bottom:14px}.detect-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#718096}.live{color:#5E7A69}.detected-title{font:24px 'DM Serif Display';margin:13px 0 3px}.meta{color:#718096;font-size:12px;margin:0}.bar{height:4px;background:#E2DCD2;margin:18px 0 7px}.bar i{display:block;height:100%;width:72%;background:#E45B45}.position{font-size:11px;color:#718096}.actions{display:flex;gap:8px;margin-top:16px}.primary,.secondary{border:0;padding:11px 13px;border-radius:5px;font-weight:600;cursor:pointer}.primary{background:#E45B45;color:#fff;flex:1}.secondary{background:transparent;color:#17263D}.foot{border-top:1px solid #DCD5CA;padding-top:14px;margin-top:20px;display:flex;justify-content:space-between;color:#718096;font-size:10px}.empty{color:#718096;font-size:12px;line-height:1.5}
</style></head><body><div class="brand"><span class="brand-mark"></span>suivi</div><p class="eyebrow">On this page</p><h1 class="title" id="title">Detecting…</h1><div class="detect"><div class="detect-head"><span id="type">Reading</span><span class="live">● Local</span></div><p class="meta" id="meta">Checking page title and structured data</p><div class="bar"><i></i></div><span class="position" id="position">No saved position yet</span><div class="actions"><button class="primary" id="save">Save progress</button><button class="secondary" id="library">Library</button></div></div><p class="empty">Suivi reads the current page only when you open the extension. Your library stays on this device.</p><div class="foot"><span>Ctrl + Shift + S</span><span>Privacy by design</span></div><script src="popup.js"></script></body></html>
