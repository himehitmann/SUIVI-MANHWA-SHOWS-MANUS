<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Suivi</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;600&display=swap');:root{font-family:'IBM Plex Sans',sans-serif;color:#15263A;background:#F3F5F4}*{box-sizing:border-box}body{width:380px;margin:0;padding:22px;background:#F3F5F4}.brand{display:flex;align-items:center;gap:9px;font:24px 'DM Serif Display';margin-bottom:28px}.brand-mark{width:25px;height:25px;border:5px solid #3A7D7A;border-top-color:transparent;border-bottom-color:transparent;border-radius:7px}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#3A7D7A;font-weight:600;margin:0 0 9px}.title{font:32px/1 'DM Serif Display';margin:0 0 18px}.detect{background:#fff;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(21,38,58,.06)}.detect-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6F7E8C}.live{color:#4C8A70}.detected-title{font:24px 'DM Serif Display';margin:13px 0 3px}.meta{color:#6F7E8C;font-size:12px;margin:0}.bar{height:4px;background:#D8E0DF;margin:18px 0 7px}.bar i{display:block;height:100%;width:72%;background:#3A7D7A}.position{font-size:11px;color:#6F7E8C}.actions{display:flex;gap:8px;margin-top:16px}.primary,.secondary,.tool-button{border:0;padding:11px 13px;border-radius:5px;font-weight:600;cursor:pointer}.primary{background:#3A7D7A;color:#fff;flex:1}.secondary{background:#E4EAE9;color:#15263A}.tool-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding:12px;background:#F3F5F4;color:#15263A;border:1px solid #D8E0DF;border-radius:6px;font-weight:600;font-size:12px}.tools{display:none;background:#fff;border:1px solid #D8E0DF;border-top:0;padding:13px}.tools.open{display:block}.speed-line{display:flex;align-items:center;justify-content:space-between;font-size:12px}.speed-actions{display:flex;align-items:center;gap:9px}.tool-button{display:grid;place-items:center;width:30px;height:30px;padding:0;background:#E4EAE9}.tool-button:hover{background:#3A7D7A;color:#fff}.speed-value{min-width:40px;text-align:center}.pip{width:100%;margin-top:12px;background:#15263A;color:#fff}.foot{border-top:1px solid #D8E0DF;padding-top:14px;margin-top:20px;display:flex;justify-content:space-between;color:#6F7E8C;font-size:10px}
</style></head><body><div class="brand"><span class="brand-mark"></span>suivi</div><p class="eyebrow">On this page</p><h1 class="title" id="title">Detecting…</h1><div class="detect"><div class="detect-head"><span id="type">Reading</span><span class="live">● Local</span></div><p class="meta" id="meta">Checking page title and structured data</p><div class="bar"><i></i></div><span class="position" id="position">No saved position yet</span><div class="actions"><button class="primary" id="save">Save progress</button><button class="secondary" id="library">Library</button></div><button class="tool-toggle" id="tools-toggle">Video tools <span>＋</span></button><div class="tools" id="tools"><div class="speed-line"><span>Playback speed</span><div class="speed-actions"><button class="tool-button" id="slower">−</button><strong class="speed-value" id="speed">1×</strong><button class="tool-button" id="faster">＋</button></div></div><button class="tool-button pip" id="pip">Open Picture-in-Picture</button></div></div><p class="empty">Suivi reads the current page only when you open the extension. Your library stays on this device.</p><div class="foot"><span>Ctrl + Shift + S</span><span>Privacy by design</span></div><script src="popup.js"></script></body></html>
