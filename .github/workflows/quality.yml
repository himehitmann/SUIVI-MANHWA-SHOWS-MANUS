name: Yomu quality
on:
  pull_request:
  push:
    branches: [main, private, "fix/**"]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
      - run: pnpm build:extension
      - run: pnpm test:package
      - run: node tests/e2e/crop.mjs
      - run: node tests/e2e/bulk-lists.mjs
      - run: node tests/e2e/video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomu-verification
          path: |
            test-results/
            yomu-extension.zip
