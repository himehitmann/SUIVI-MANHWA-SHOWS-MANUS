name: Yomu quality
on:
  pull_request:
  push:
    branches: [main, private, "fix/**"]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/security-check.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
      - run: pnpm build:extension
      - run: pnpm test:package
      - run: node tests/e2e/crop.mjs
      - run: node tests/e2e/bulk-lists.mjs
      - run: node tests/e2e/video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomu-verification
          path: |
            test-results/
            yomu-extension.zip
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yomu_load
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolated PostgreSQL capacity probe
        run: node --import tsx scripts/verify-load.mjs
        env:
          LOAD_DATABASE_URL: postgresql://postgres:synthetic-ci-fixture@127.0.0.1:5432/yomu_load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomu-load-report
          path: test-results/load-report.json

