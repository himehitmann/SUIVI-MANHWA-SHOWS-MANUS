name: Prepare Vite security update
on:
  push:
    branches: ["fix/yomu-p0-reliability"]
    paths: [".github/workflows/prepare-vite-security.yml"]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm add -D vite@7.3.7 --lockfile-only --ignore-scripts
      - name: Emit generated dependency files
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const path of ['package.json','pnpm-lock.yaml']) {
            const content=readFileSync(path,'utf8');
            for(let offset=0;offset<content.length;offset+=3000) {
              console.log('YOMU_LOCK_CHUNK '+JSON.stringify({path,offset,text:content.slice(offset,offset+3000)}));
            }
          }
          NODE
