name: Resolve security patch lockfile
on:
  push:
    branches: [fix/yomu-p0-reliability]
    paths: [.github/workflows/resolve-security.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched dependencies without executing package scripts
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies.zod='^4.6.6'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n'); const w=fs.readFileSync('pnpm-workspace.yaml','utf8').replace('overrides:\n','overrides:\n  express>body-parser: 1.20.9\n'); fs.writeFileSync('pnpm-workspace.yaml',w);"
          pnpm install --lockfile-only --ignore-scripts
          git diff -- package.json pnpm-workspace.yaml pnpm-lock.yaml
