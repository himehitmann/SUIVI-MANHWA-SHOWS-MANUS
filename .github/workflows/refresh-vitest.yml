name: Refresh Vitest lockfile
on:
  push:
    branches: ["fix/yomu-p0-reliability"]
    paths: [".github/workflows/refresh-vitest.yml"]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm update vitest@4.1.12 --lockfile-only --ignore-scripts
      - name: Return generated dependency files
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const file of ["package.json", "pnpm-lock.yaml"]) console.log("YOMU_LOCK_RESULT:" + JSON.stringify({file, content: fs.readFileSync(file, "utf8")}));'
