name: Package extension

# Builds a ready-to-load Chrome/Edge extension zip and publishes it as the
# "yomu-latest" release, so the extension can be downloaded, unzipped and loaded
# without hunting for the manifest inside the repo.

on:
  push:
    branches: [main, private]
    paths:
      - "manifest.json"
      - "*.js"
      - "popup.html"
      - "options.html"
      - "library.html"
      - "icon.png"
      - "scripts/pack-extension.sh"
      - ".github/workflows/extension-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension files (manifest at the zip root)
        run: |
          bash scripts/pack-extension.sh
          unzip -l yomu-extension.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomu-extension
          path: yomu-extension.zip

      - name: Publish/refresh the yomu-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download yomu-extension.zip, unzip it, then in chrome://extensions enable Developer mode and click 'Load unpacked' and select the unzipped folder (the one containing manifest.json)."
          gh release view yomu-latest >/dev/null 2>&1 \
            && gh release edit yomu-latest --notes "$NOTES" \
            || gh release create yomu-latest -t "Yomu extension (latest)" -n "$NOTES"
          gh release upload yomu-latest yomu-extension.zip --clobber
