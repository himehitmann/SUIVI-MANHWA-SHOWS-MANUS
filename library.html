<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dasi</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");
      :root {
        --ink:#241F33; --muted:#8B8797; --line:#ECE8F3; --bg:#FBFAFE; --card:#fff;
        --lav:#EFE9FF; --lav-ink:#6B57B8; --lav-deep:#5C4AA3; --green:#5FB79A; --blue:#7E9BE6;
        --gold:#EAB040; --rose:#EC6A7E; --game:#E08A4F;
        --shadow:0 10px 30px rgba(92,74,140,.08); --shadow-lg:0 22px 50px rgba(70,52,120,.16); --radius:18px;
      }
      * { box-sizing:border-box; }
      html,body { overflow-x:hidden; }
      body { margin:0; font-family:"DM Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
      button,input,select { font:inherit; }
      a { color:inherit; }
      .ic { width:18px; height:18px; stroke:currentColor; stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block; }
      .ic.fill { fill:currentColor; stroke:none; }
      .scroll-x { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity; padding:4px 2px 12px; scrollbar-width:thin; }
      .scroll-x::-webkit-scrollbar { height:7px; } .scroll-x::-webkit-scrollbar-thumb { background:#E1DAF0; border-radius:99px; }
      .scroll-x > * { scroll-snap-align:start; }

      /* ---- top bar ---- */
      header { display:flex; align-items:center; gap:14px; padding:14px clamp(16px,4vw,56px); position:sticky; top:0; z-index:30; background:rgba(251,250,254,.85); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
      .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.04em; background:none; border:0; cursor:pointer; padding:0; color:inherit; }
      .logo { width:27px; height:27px; border-radius:9px 9px 9px 3px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); display:grid; place-items:center; transform:rotate(-8deg); transition:transform .3s; box-shadow:0 5px 14px rgba(145,121,220,.25); }
      .brand:hover .logo { transform:rotate(0) scale(1.06); }
      .logo i { width:9px; height:9px; background:#fff; border-radius:3px; opacity:.92; }
      .shine { background:linear-gradient(100deg,#6B57B8 30%,#B6A2F0 50%,#6B57B8 70%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 5s linear infinite; }
      @keyframes shine { to { background-position:200% center; } }
      .search { display:flex; align-items:center; gap:9px; background:#F3F1F9; border:1px solid transparent; border-radius:12px; padding:9px 13px; width:min(320px,34vw); color:var(--muted); transition:.15s; margin-left:12px; }
      .search:focus-within { background:#fff; border-color:#DCD3F0; box-shadow:0 4px 14px rgba(120,100,200,.08); }
      .search input { border:0; outline:0; background:transparent; width:100%; font-size:13.5px; color:var(--ink); }
      .top-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
      .lang-btn, .icon-btn { display:flex; align-items:center; gap:6px; height:40px; padding:0 11px; border-radius:12px; border:1px solid var(--line); background:#fff; color:#6E6980; cursor:pointer; position:relative; transition:.15s; }
      .icon-btn { width:40px; justify-content:center; padding:0; }
      .lang-btn:hover, .icon-btn:hover { background:#F3F1F9; color:var(--ink); }
      .lang-btn b { font-size:12.5px; font-weight:700; }
      .badge-dot { position:absolute; top:7px; right:8px; min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--rose); color:#fff; font-size:9px; font-weight:800; display:grid; place-items:center; border:2px solid #fff; }
      .avatar { width:40px; height:40px; border-radius:50%; border:2px solid #fff; box-shadow:0 3px 10px rgba(92,74,140,.18); cursor:pointer; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); }
      .avatar img { width:100%; height:100%; object-fit:cover; }

      .menu { position:absolute; top:56px; right:0; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-lg); width:230px; padding:8px; z-index:50; display:none; }
      .menu.open { display:block; animation:pop .16s ease; }
      @keyframes pop { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
      .menu-head { display:flex; align-items:center; gap:10px; padding:10px; }
      .menu-head .avatar { width:38px; height:38px; box-shadow:none; }
      .menu-head b { font-size:14px; } .menu-head small { display:block; color:var(--muted); font-size:11px; }
      .menu button { width:100%; display:flex; align-items:center; gap:10px; border:0; background:none; text-align:left; padding:10px; border-radius:10px; font-size:13px; font-weight:600; color:#4E4960; cursor:pointer; }
      .menu button:hover { background:#F3F1F9; }
      .menu .sep { height:1px; background:var(--line); margin:6px 4px; }
      .lang-menu { position:absolute; top:56px; right:60px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px; z-index:50; display:none; width:170px; }
      .lang-menu.open { display:block; animation:pop .16s ease; }
      .notif-menu { right:52px; width:300px; max-height:60vh; overflow-y:auto; }
      .notif-head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 6px; }
      .notif-head b { font-size:13px; } .notif-head button { width:auto; font-size:11px; color:var(--lav-ink); padding:4px 6px; }
      .notif-item { display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:10px; cursor:pointer; }
      .notif-item:hover { background:#F3F1F9; } .notif-item .dot2 { width:8px; height:8px; border-radius:50%; background:var(--rose); margin-top:5px; flex-shrink:0; }
      .notif-item .dot2.read { background:transparent; } .notif-item b { font-size:13px; display:block; } .notif-item small { font-size:11px; color:var(--muted); }
      .notif-empty { text-align:center; color:var(--muted); font-size:12px; padding:22px 6px; }
      .lang-menu button { width:100%; display:flex; align-items:center; gap:9px; border:0; background:none; text-align:left; padding:9px 10px; border-radius:9px; font-size:13px; font-weight:600; color:#4E4960; cursor:pointer; }
      .lang-menu button:hover { background:#F3F1F9; } .lang-menu button.on { background:var(--lav); color:var(--lav-ink); }

      /* ---- nav ---- */
      nav.tabs { display:flex; gap:4px; padding:0 clamp(16px,4vw,56px); border-bottom:1px solid var(--line); position:sticky; top:69px; background:rgba(251,250,254,.85); backdrop-filter:blur(16px); z-index:20; overflow-x:auto; }
      nav.tabs button { border:0; background:none; cursor:pointer; padding:14px 14px; font-size:13.5px; font-weight:600; color:#8A8698; position:relative; white-space:nowrap; transition:color .15s; }
      nav.tabs button:hover { color:var(--ink); }
      nav.tabs button.active { color:var(--lav-ink); }
      nav.tabs button.active::after { content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2.5px; border-radius:99px; background:var(--lav-ink); }

      main { max-width:1140px; margin:auto; padding:26px clamp(16px,4vw,56px) 100px; }
      .view { display:none; animation:fade .28s ease; }
      .view.active { display:block; }
      @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
      h1 { font-size:30px; letter-spacing:-.04em; margin:2px 0 3px; }
      .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
      .section-h { display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 4px; }
      .section-h h2 { font-size:18px; letter-spacing:-.03em; margin:0; }
      .section-h span { font-size:12px; color:var(--muted); }

      /* ---- spotlight ---- */
      .spot { position:relative; border-radius:26px; overflow:hidden; min-height:280px; display:flex; align-items:flex-end; box-shadow:var(--shadow-lg); cursor:pointer; }
      .spot-bg { position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.05); filter:saturate(1.05); transition:opacity .6s; }
      .spot-grad { position:absolute; inset:0; background:linear-gradient(90deg,rgba(20,14,35,.86) 0%,rgba(24,16,42,.62) 45%,rgba(24,16,42,.15) 100%); }
      .spot-fallback { position:absolute; inset:0; background:linear-gradient(120deg,#5C4AA3,#5FB79A); }
      .spot-inner { position:relative; padding:30px clamp(22px,4vw,42px); color:#fff; max-width:640px; }
      .spot-badges { display:flex; gap:8px; margin-bottom:12px; }
      .pill { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.16); backdrop-filter:blur(4px); }
      .pill.new { background:var(--rose); } .pill.soon { background:var(--game); } .pill.game { background:var(--game); }
      .spot h2 { font-size:32px; letter-spacing:-.04em; margin:0 0 6px; line-height:1.05; text-shadow:0 2px 20px rgba(0,0,0,.3); }
      .spot p { font-size:14px; opacity:.9; margin:0 0 20px; }
      .spot-cta { display:flex; gap:10px; }
      .btn-glass { display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; font-weight:700; font-size:13px; border-radius:999px; padding:12px 22px; background:#fff; color:var(--ink); transition:transform .16s, box-shadow .16s; }
      .btn-glass.ghost { background:rgba(255,255,255,.18); color:#fff; backdrop-filter:blur(4px); }
      .btn-glass:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(0,0,0,.22); }
      .dots { position:absolute; bottom:20px; right:24px; display:flex; gap:7px; z-index:3; }
      .dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.4); cursor:pointer; transition:.2s; }
      .dots i.on { background:#fff; width:22px; border-radius:99px; }

      /* ---- poster cards (rows) ---- */
      .poster { width:160px; flex:0 0 auto; cursor:pointer; }
      .poster .art { position:relative; width:160px; height:214px; border-radius:16px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:34px; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s; }
      .poster:hover .art { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
      .poster .art img { width:100%; height:100%; object-fit:cover; }
      .poster .art .flag { position:absolute; top:8px; left:8px; font-size:9px; font-weight:800; letter-spacing:.04em; padding:3px 7px; border-radius:7px; color:#fff; background:var(--rose); box-shadow:0 3px 8px rgba(0,0,0,.2); }
      .poster .art .flag.soon { background:var(--game); }
      .poster .art .prog { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.3); }
      .poster .art .prog i { display:block; height:100%; }
      .poster h4 { font-size:13px; margin:9px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .poster small { font-size:11px; color:var(--muted); }

      /* genre chips */
      .genres { display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }
      .genre { display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); transition:.15s; }
      .genre:hover { border-color:#D9CFF0; transform:translateY(-2px); }
      .genre b { color:var(--lav-ink); }

      .onboard { text-align:center; padding:60px 20px; }
      .onboard .big { width:70px; height:70px; margin:0 auto 18px; border-radius:20px 20px 20px 8px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); display:grid; place-items:center; transform:rotate(-8deg); box-shadow:var(--shadow-lg); }
      .onboard .big i { width:22px; height:22px; background:#fff; border-radius:7px; }
      .onboard h2 { font-size:24px; letter-spacing:-.03em; margin:0 0 8px; }
      .onboard p { color:var(--muted); max-width:440px; margin:0 auto; font-size:14px; line-height:1.6; }

      /* ---- grid (library) ---- */
      .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:11px; margin:0 0 22px; }
      .chip { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow); }
      .chip b { display:block; font-size:21px; letter-spacing:-.03em; } .chip span { font-size:11px; color:var(--muted); font-weight:600; }
      .filters { display:flex; gap:8px; margin:0 0 18px; flex-wrap:wrap; }
      .filters button { border:0; cursor:pointer; border-radius:999px; padding:8px 14px; background:#F2F0F8; color:#7D7989; font-size:12px; font-weight:600; transition:.15s; }
      .filters button.active { background:var(--lav); color:var(--lav-ink); }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:13px; }
      .card { position:relative; display:flex; gap:13px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:13px; box-shadow:var(--shadow); cursor:pointer; transition:.16s; }
      .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#E4DCF4; }
      .cover { width:54px; height:72px; border-radius:10px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; flex-shrink:0; position:relative; }
      .cover img { width:100%; height:100%; object-fit:cover; }
      .new-flag { position:absolute; top:5px; left:5px; background:var(--rose); color:#fff; font-size:8.5px; font-weight:800; padding:2px 6px; border-radius:6px; }
      .card-body { min-width:0; flex:1; }
      .card h3 { font-size:14px; margin:0 24px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .card p { font-size:11px; color:var(--muted); margin:5px 0 8px; }
      .bar { height:5px; background:#EDE8F6; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; }
      .card small { display:block; font-size:10px; color:#9E97A7; margin-top:6px; }
      .rate { display:flex; gap:2px; margin-top:8px; } .rate .ic { width:14px; height:14px; color:#DDD8E8; cursor:pointer; transition:.12s; } .rate .ic:hover { transform:scale(1.18); } .rate .ic.on { color:var(--gold); }
      .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; } .tag { font-size:9px; font-weight:700; background:var(--lav); color:var(--lav-ink); border-radius:6px; padding:2px 7px; }
      .fav { position:absolute; top:11px; right:11px; border:0; background:none; cursor:pointer; color:#D6D0E4; padding:0; transition:.15s; } .fav:hover { transform:scale(1.18); } .fav.on { color:var(--gold); } .fav .ic { width:17px; height:17px; }
      .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:56px 0; }

      /* lists */
      .list-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
      .list-card { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--card); box-shadow:var(--shadow); cursor:pointer; transition:.16s; }
      .list-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
      .list-cover { height:104px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:26px; background-size:cover; background-position:center; }
      .list-meta { padding:12px 14px; } .list-meta b { font-size:14px; } .list-meta span { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
      .new-list { border:1.5px dashed #D6CEEA; background:transparent; box-shadow:none; display:grid; place-items:center; min-height:150px; color:#8E86A6; gap:6px; }
      .new-list:hover { border-color:var(--lav-ink); color:var(--lav-ink); }

      /* games */
      .game-card { display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); transition:.16s; }
      .game-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
      .game-cover { width:96px; height:128px; border-radius:12px; overflow:hidden; flex-shrink:0; display:grid; place-items:center; color:#fff; font-weight:800; font-size:26px; background:linear-gradient(145deg,#E0A46F,#E08A4F); position:relative; }
      .game-cover img { width:100%; height:100%; object-fit:cover; }
      .game-body { flex:1; min-width:0; } .game-body h3 { margin:0 0 4px; font-size:16px; letter-spacing:-.02em; }
      .game-meta { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
      .meta-pill { font-size:11px; font-weight:700; background:#F5F2FB; color:#6E6980; border-radius:8px; padding:5px 10px; display:inline-flex; align-items:center; gap:6px; }
      .meta-pill.price { background:#EAF7F1; color:#3E8E70; } .meta-pill.date { background:#FBF0E7; color:#B9743C; }
      .game-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
      .prereg { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:#6E6980; cursor:pointer; }
      .prereg .box { width:20px; height:20px; border-radius:6px; border:1.8px solid #CFC6E6; display:grid; place-items:center; color:#fff; transition:.15s; }
      .prereg.on .box { background:var(--green); border-color:var(--green); }

      /* plans */
      .plan-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:8px; }
      .plan { border:1px solid var(--line); border-radius:20px; background:var(--card); padding:24px; box-shadow:var(--shadow); position:relative; display:flex; flex-direction:column; }
      .plan.feat { border-color:transparent; box-shadow:0 20px 50px rgba(107,87,184,.22); background:linear-gradient(180deg,#fff, #FBF9FF); outline:2px solid var(--lav-ink); }
      .plan .ptag { position:absolute; top:-11px; left:24px; background:var(--lav-ink); color:#fff; font-size:10px; font-weight:800; letter-spacing:.05em; padding:5px 11px; border-radius:999px; }
      .plan h3 { margin:0 0 4px; font-size:16px; } .plan .price { font-size:32px; font-weight:800; letter-spacing:-.03em; margin:8px 0 2px; }
      .plan .price small { font-size:13px; font-weight:600; color:var(--muted); }
      .plan .per { font-size:12px; color:var(--muted); margin-bottom:16px; }
      .plan ul { list-style:none; padding:0; margin:0 0 20px; display:flex; flex-direction:column; gap:9px; }
      .plan li { display:flex; gap:9px; font-size:13px; color:#4E4960; } .plan li .ic { width:16px; height:16px; color:var(--green); margin-top:2px; }
      .plan .cta { margin-top:auto; border:0; cursor:pointer; border-radius:12px; padding:12px; font-weight:700; font-size:13.5px; background:#F2F0F8; color:var(--lav-ink); }
      .plan.feat .cta { background:var(--lav-ink); color:#fff; } .plan .cta:hover { filter:brightness(.97); }
      .unlocked-banner { display:flex; align-items:center; gap:12px; background:linear-gradient(120deg,#EAF7F1,#EFEAFF); border:1px solid #DBEDE4; border-radius:16px; padding:16px 20px; margin-bottom:18px; font-size:14px; font-weight:600; color:#3E7A63; }

      /* settings */
      .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 20px; margin-bottom:16px; }
      .row { display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; }
      .row .grow { flex:1; min-width:0; } .row b { font-size:14px; } .row small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
      .switch { width:44px; height:26px; border-radius:99px; background:#DCD6E8; border:0; cursor:pointer; position:relative; transition:.18s; flex-shrink:0; }
      .switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.15); transition:.18s; }
      .switch.on { background:var(--green); } .switch.on::after { transform:translateX(18px); }
      .btn { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:11px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s; }
      .btn:hover { background:#F3F1F9; } .btn.primary { background:var(--lav-ink); color:#fff; border-color:var(--lav-ink); } .btn.primary:hover { background:var(--lav-deep); }
      .btn.danger { color:#C7788B; border-color:#F0DCE1; } .btn.danger:hover { background:#FBEEF1; }
      .field { border:1px solid var(--line); border-radius:11px; padding:10px 13px; font-size:13.5px; outline:0; width:100%; background:#fff; } .field:focus { border-color:#DCD3F0; }
      .avatar-lg { width:64px; height:64px; border-radius:50%; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:22px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); cursor:pointer; } .avatar-lg img { width:100%; height:100%; object-fit:cover; }
      .share-row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
      .soc { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:#fff; color:#5D5870; cursor:pointer; transition:.15s; } .soc:hover { transform:translateY(-2px); }
      .soc.x:hover{background:#000;color:#fff} .soc.fb:hover{background:#1877F2;color:#fff} .soc.wa:hover{background:#25D366;color:#fff} .soc.rd:hover{background:#FF4500;color:#fff} .soc.cp:hover{background:var(--lav);color:var(--lav-ink)}
      .rate-big { display:flex; gap:4px; } .rate-big .ic { width:26px; height:26px; color:#DDD8E8; cursor:pointer; transition:.16s; } .rate-big .ic:hover { transform:scale(1.16); } .rate-big .ic.on { color:var(--gold); }
      .section-t { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#9A93AC; margin:22px 0 10px; }

      /* drawer */
      .scrim { position:fixed; inset:0; background:rgba(40,32,60,.34); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:.22s; z-index:60; } .scrim.open { opacity:1; pointer-events:auto; }
      .drawer { position:fixed; top:0; right:0; height:100%; width:min(450px,95vw); background:var(--bg); box-shadow:-20px 0 50px rgba(60,45,95,.18); transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.1,1); z-index:61; overflow-y:auto; } .drawer.open { transform:none; }
      .drawer-hero { position:relative; padding:22px 22px 18px; background:linear-gradient(120deg,#F2ECFF,#E9F6F1); }
      .drawer-close { position:absolute; top:16px; right:16px; }
      .drawer-cover { width:112px; height:150px; border-radius:14px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:40px; box-shadow:0 12px 28px rgba(92,74,140,.25); position:relative; }
      .drawer-cover img { width:100%; height:100%; object-fit:cover; }
      .change-cover { position:absolute; bottom:6px; right:6px; width:28px; height:28px; border-radius:9px; background:rgba(255,255,255,.92); color:var(--lav-ink); display:grid; place-items:center; border:0; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.15); } .change-cover .ic { width:15px; height:15px; }
      .drawer-title { font-size:20px; letter-spacing:-.03em; margin:14px 0 4px; } .drawer-marker { font-size:13px; color:#6f6b7d; margin:0; }
      .drawer-body { padding:20px 22px 40px; }
      .synopsis { font-size:13px; line-height:1.6; color:#4E4960; margin:0; } .synopsis.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
      .link-btn { border:0; background:none; color:var(--lav-ink); font-weight:600; font-size:12px; cursor:pointer; padding:6px 0 0; }
      .stepper { display:flex; align-items:center; gap:10px; } .stepper button { width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; display:grid; place-items:center; } .stepper button:hover { background:#F3F1F9; }
      .stepper input { width:64px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:8px; font-weight:700; } .stepper span { font-size:12px; color:var(--muted); }
      .released-row { display:flex; align-items:center; gap:10px; margin-top:12px; } .released-row input { width:64px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:8px; font-weight:700; } .rel-label { font-size:12px; font-weight:600; color:#6E6980; } .rel-hint { font-size:12px; font-weight:700; color:var(--rose); }
      .ep-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(36px,1fr)); gap:6px; margin-top:14px; max-height:220px; overflow-y:auto; padding:2px; }
      .ep { border:1px solid var(--line); background:#fff; color:#9E97A7; border-radius:8px; padding:7px 0; font-size:11px; font-weight:700; cursor:pointer; transition:.12s; } .ep:hover { border-color:var(--lav-ink); color:var(--lav-ink); }
      .ep.seen { background:var(--lav-ink); border-color:transparent; color:#fff; }
      .chips-wrap { display:flex; gap:7px; flex-wrap:wrap; }
      .chip-toggle { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; color:#6E6980; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.14s; } .chip-toggle.on { background:var(--lav); border-color:transparent; color:var(--lav-ink); }
      .tag-edit { display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .tag-edit .tag { display:inline-flex; align-items:center; gap:5px; } .tag-edit .tag .rm { cursor:pointer; opacity:.6; } .tag-edit .tag .rm:hover { opacity:1; }
      .tag-add { border:1px dashed #CFC6E6; background:transparent; color:#9A93AC; border-radius:6px; padding:2px 8px; font-size:9px; font-weight:700; cursor:pointer; }
      .li-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; box-shadow:0 4px 12px rgba(92,74,140,.05); } .li-row.dragging { opacity:.45; } .li-row.over { border-color:var(--lav-ink); }
      .grip { color:#C7C1D6; cursor:grab; display:grid; place-items:center; } .li-cover { width:34px; height:46px; border-radius:7px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:14px; flex-shrink:0; } .li-cover img { width:100%; height:100%; object-fit:cover; }
      .li-row b { font-size:13px; } .li-row small { display:block; color:var(--muted); font-size:11px; }
      .back-btn { display:inline-flex; align-items:center; gap:7px; border:0; background:none; color:var(--lav-ink); font-weight:600; font-size:13px; cursor:pointer; padding:0 0 14px; }

      .crop-scrim { position:fixed; inset:0; background:rgba(40,32,60,.45); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.2s; z-index:90; } .crop-scrim.open { opacity:1; pointer-events:auto; }
      .cropper { position:fixed; top:50%; left:50%; transform:translate(-50%,-46%) scale(.96); opacity:0; pointer-events:none; width:340px; max-width:94vw; background:#fff; border-radius:20px; box-shadow:0 30px 70px rgba(50,36,90,.35); padding:22px; z-index:91; transition:.22s; }
      .cropper.open { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
      .cropper h3 { margin:0 0 2px; font-size:17px; letter-spacing:-.02em; } .crop-hint { margin:0 0 16px; font-size:12px; color:var(--muted); }
      .crop-view { width:280px; height:280px; margin:0 auto; border-radius:16px; overflow:hidden; background:#F0EEF6; touch-action:none; cursor:grab; position:relative; }
      .crop-view.circle { border-radius:50%; } .crop-view:active { cursor:grabbing; }
      .crop-view canvas { display:block; width:280px; height:280px; }
      #crop-zoom { width:100%; margin:16px 0 4px; accent-color:var(--lav-ink); }
      .crop-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
      .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#241F33; color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:80; box-shadow:0 12px 30px rgba(0,0,0,.25); } .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
      input[type=file] { display:none; }
    </style>
  </head>
  <body>
    <header>
      <button class="brand" id="brand" title="Home"><span class="logo"><i></i></span><span class="shine">Dasi</span></button>
      <label class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search" /></label>
      <div class="top-right">
        <button class="lang-btn" id="lang-btn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg><b id="lang-code">EN</b></button>
        <button class="icon-btn" id="bell" title="Updates"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button class="avatar" id="avatar" title="Profile"></button>
        <div class="lang-menu" id="lang-menu"></div>
        <div class="menu notif-menu" id="notif-menu"></div>
        <div class="menu" id="profile-menu"></div>
      </div>
    </header>
    <nav class="tabs" id="nav"></nav>

    <main>
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-library">
        <h1 data-t="library"></h1>
        <p class="sub" data-t="librarySub"></p>
        <div class="stats" id="stats"></div>
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
      </section>
      <section class="view" id="view-lists">
        <div id="lists-index">
          <h1 data-t="lists"></h1>
          <p class="sub" data-t="listsSub"></p>
          <div class="list-grid" id="list-grid"></div>
        </div>
        <div id="list-detail" hidden></div>
      </section>
      <section class="view" id="view-games"></section>
      <section class="view" id="view-plans"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer"></aside>

    <div class="crop-scrim" id="crop-scrim"></div>
    <div class="cropper" id="cropper" role="dialog" aria-modal="true">
      <h3 id="crop-title">Adjust image</h3>
      <p class="crop-hint">Drag to reposition · slide to zoom</p>
      <div class="crop-view" id="crop-view"><canvas id="crop-canvas" width="280" height="280"></canvas></div>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" />
      <div class="crop-actions">
        <button class="btn" id="crop-file">Choose image</button>
        <span style="flex:1"></span>
        <button class="btn" id="crop-cancel">Cancel</button>
        <button class="btn primary" id="crop-save">Save</button>
      </div>
      <input id="crop-input" type="file" accept="image/*" />
    </div>

    <div class="toast" id="toast"></div>
    <script src="edition.js"></script>
    <script src="library.js"></script>
  </body>
</html>
