<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yomu</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");
      :root {
        --ink:#241F33; --muted:#8B8797; --line:#ECE8F3; --bg:#FBFAFE; --card:#fff;
        --lav:#EFE9FF; --lav-ink:#6B57B8; --lav-deep:#5C4AA3; --green:#5FB79A; --blue:#7E9BE6;
        --gold:#EAB040; --rose:#EC6A7E; --game:#E08A4F;
        --shadow:0 10px 30px rgba(92,74,140,.08); --shadow-lg:0 22px 50px rgba(70,52,120,.16); --radius:18px;
      }
      * { box-sizing:border-box; }
      html,body { overflow-x:hidden; }
      body { margin:0; font-family:"DM Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
      button,input,select { font:inherit; }
      a { color:inherit; }
      .ic { width:18px; height:18px; stroke:currentColor; stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block; }
      /* premium tooltips */
      [data-tip] { position:relative; }
      [data-tip]::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%) translateY(4px); background:#241F33; color:#fff; font-size:11px; font-weight:600; white-space:nowrap; padding:5px 9px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; box-shadow:0 8px 20px rgba(0,0,0,.28); z-index:70; }
      [data-tip]::before { content:""; position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#241F33; opacity:0; transition:opacity .16s; z-index:70; }
      [data-tip]:hover::after { opacity:1; transform:translateX(-50%) translateY(0); }
      [data-tip]:hover::before { opacity:1; }
      .ic.fill { fill:currentColor; stroke:none; }
      .scroll-x { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity; padding:4px 2px 12px; scrollbar-width:thin; }
      .scroll-x::-webkit-scrollbar { height:7px; } .scroll-x::-webkit-scrollbar-thumb { background:#E1DAF0; border-radius:99px; }
      .scroll-x > * { scroll-snap-align:start; }
      /* Robust cover images: placeholder letter always sits behind; the image
         overlays it and is hidden if it fails to load (no broken-image icon). */
      img.cov { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; display:block; background:inherit; }
      img.cov.failed { display:none; }
      .cover-ph { position:relative; z-index:0; display:grid; place-items:center; width:100%; height:100%; user-select:none; }

      /* ---- top bar ---- */
      header { display:flex; align-items:center; gap:18px; padding:15px clamp(18px,4vw,60px); position:sticky; top:0; z-index:30; background:rgba(251,250,254,.82); backdrop-filter:blur(18px) saturate(1.3); border-bottom:1px solid var(--line); }
      .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:21px; letter-spacing:-.04em; background:none; border:0; cursor:pointer; padding:0; color:inherit; }
      .logo { width:31px; height:31px; border-radius:10px 10px 10px 4px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); display:grid; place-items:center; transform:rotate(-8deg); transition:transform .3s; box-shadow:0 6px 16px rgba(145,121,220,.3); }
      .brand:hover .logo { transform:rotate(0) scale(1.06); }
      .logo i { width:10px; height:10px; background:#fff; border-radius:3px; opacity:.92; }
      .pro-btn { display:inline-flex; align-items:center; gap:7px; height:42px; padding:0 16px; border-radius:12px; border:0; cursor:pointer; font-weight:800; font-size:13px; letter-spacing:-.01em; color:#fff; background:linear-gradient(120deg,#7B61E0,#9B7BF0 55%,#E58AB0); box-shadow:0 6px 18px rgba(123,97,224,.35); transition:transform .16s, box-shadow .16s; white-space:nowrap; }
      .pro-btn:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(123,97,224,.45); }
      .pro-btn .ic { width:16px; height:16px; }
      .shine { color:#6B57B8; background:linear-gradient(100deg,#6B57B8 0%,#6B57B8 42%,#EFE7FF 50%,#6B57B8 58%,#6B57B8 100%); background-size:260% 100%; background-position:120% center; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:sheen 4.5s ease-in-out infinite; }
      @keyframes sheen { 0%,12% { background-position:120% center; } 55%,100% { background-position:-60% center; } }
      @media (prefers-reduced-motion: reduce) { .shine { animation:none; -webkit-text-fill-color:#6B57B8; } }
      .search { display:flex; align-items:center; gap:10px; background:#F3F1F9; border:1.5px solid transparent; border-radius:13px; padding:11px 16px; width:min(460px,40vw); color:var(--muted); transition:.15s; margin:0 auto; }
      .search:focus-within { background:#fff; border-color:#C9BCF0; box-shadow:0 6px 18px rgba(120,100,200,.12); }
      .search input { border:0; outline:0; background:transparent; width:100%; font-size:14px; color:var(--ink); }
      .top-right { display:flex; align-items:center; gap:10px; }
      .lang-btn, .icon-btn { display:flex; align-items:center; gap:6px; height:42px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:#fff; color:#6E6980; cursor:pointer; position:relative; transition:.15s; }
      .icon-btn { width:42px; justify-content:center; padding:0; }
      .lang-btn:hover, .icon-btn:hover { background:#F3F1F9; color:var(--ink); border-color:#DCD3F0; }
      .lang-btn b { font-size:12.5px; font-weight:700; }
      .badge-dot { position:absolute; top:7px; right:8px; min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--rose); color:#fff; font-size:9px; font-weight:800; display:grid; place-items:center; border:2px solid #fff; }
      .avatar { width:42px; height:42px; border-radius:50%; border:2px solid #fff; box-shadow:0 3px 10px rgba(92,74,140,.2); cursor:pointer; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:16px; background:linear-gradient(145deg,#B7A2F2,#8AD3C0); transition:transform .15s, box-shadow .15s; }
      .avatar:hover { transform:scale(1.05); box-shadow:0 6px 16px rgba(92,74,140,.3); }
      .avatar img { width:100%; height:100%; object-fit:cover; }

      .menu { position:absolute; top:56px; right:0; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-lg); width:230px; padding:8px; z-index:50; display:none; }
      .menu.open { display:block; animation:pop .16s ease; }
      @keyframes pop { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
      .menu-head { display:flex; align-items:center; gap:10px; padding:10px; }
      .menu-head .avatar { width:38px; height:38px; box-shadow:none; }
      .menu-head b { font-size:14px; } .menu-head small { display:block; color:var(--muted); font-size:11px; }
      .menu button { width:100%; display:flex; align-items:center; gap:10px; border:0; background:none; text-align:left; padding:10px; border-radius:10px; font-size:13px; font-weight:600; color:#4E4960; cursor:pointer; }
      .menu button:hover { background:#F3F1F9; }
      .menu .sep { height:1px; background:var(--line); margin:6px 4px; }
      .lang-menu { position:absolute; top:56px; right:60px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px; z-index:50; display:none; width:170px; }
      .lang-menu.open { display:block; animation:pop .16s ease; }
      .notif-menu { right:52px; width:300px; max-height:60vh; overflow-y:auto; }
      .notif-head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 6px; }
      .notif-head b { font-size:13px; } .notif-head button { width:auto; font-size:11px; color:var(--lav-ink); padding:4px 6px; }
      .notif-item { display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:10px; cursor:pointer; }
      .notif-item:hover { background:#F3F1F9; } .notif-item .dot2 { width:8px; height:8px; border-radius:50%; background:var(--rose); margin-top:5px; flex-shrink:0; }
      .notif-item .dot2.read { background:transparent; } .notif-item b { font-size:13px; display:block; } .notif-item small { font-size:11px; color:var(--muted); }
      .notif-empty { text-align:center; color:var(--muted); font-size:12px; padding:22px 6px; }
      .lang-menu button { width:100%; display:flex; align-items:center; gap:9px; border:0; background:none; text-align:left; padding:9px 10px; border-radius:9px; font-size:13px; font-weight:600; color:#4E4960; cursor:pointer; }
      .lang-menu button:hover { background:#F3F1F9; } .lang-menu button.on { background:var(--lav); color:var(--lav-ink); }

      /* ---- nav (inline in the top bar) ---- */
      nav.tabs { display:flex; gap:4px; margin-left:6px; }
      nav.tabs button { border:0; background:none; cursor:pointer; padding:10px 15px; font-size:14.5px; font-weight:700; color:#8A8698; position:relative; white-space:nowrap; border-radius:11px; transition:color .15s, background .15s; }
      nav.tabs button:hover { color:var(--ink); background:#F3F1F9; }
      nav.tabs button.active { color:var(--lav-ink); background:var(--lav); }
      @media (max-width:820px){ nav.tabs button{ padding:9px 10px; font-size:13px; } .brand .shine{ display:none; } .search{ width:auto; flex:1; } }

      /* global button feel */
      button { transition:transform .12s ease, box-shadow .15s ease, background .15s ease, color .15s ease, filter .15s ease; }
      button:active:not(:disabled) { transform:scale(.96); }

      /* lists strip inside Library */
      .lists-strip-head { display:flex; align-items:center; justify-content:space-between; margin:22px 0 2px; }
      .lists-strip-head h2 { font-size:16px; letter-spacing:-.02em; margin:0; }
      .btn.sm { padding:6px 11px; font-size:12px; }
      .strip-list { flex:0 0 auto; width:150px; cursor:pointer; }
      .strip-list .lc { width:150px; height:84px; border-radius:14px; background-size:cover; background-position:center; display:grid; place-items:center; color:#fff; font-weight:800; font-size:22px; box-shadow:var(--shadow); transition:transform .16s, box-shadow .16s; }
      .strip-list:hover .lc { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
      .strip-list b { display:block; font-size:12.5px; margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .strip-list small { font-size:10.5px; color:var(--muted); }
      .strip-new { flex:0 0 auto; width:150px; height:84px; border:1.5px dashed #D6CEEA; border-radius:14px; background:transparent; color:#8E86A6; display:grid; place-items:center; cursor:pointer; }
      .strip-new:hover { border-color:var(--lav-ink); color:var(--lav-ink); }
      .site-chips { display:flex; gap:9px; flex-wrap:wrap; }
      .site-chip { display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 14px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); transition:transform .15s, border-color .15s; }
      .site-chip:hover { transform:translateY(-2px); border-color:#D9CFF0; }
      .site-chip .fav-dot { width:22px; height:22px; border-radius:7px; background:var(--lav); color:var(--lav-ink); display:grid; place-items:center; font-weight:800; font-size:11px; }
      .site-chip .rm-site { opacity:.45; cursor:pointer; } .site-chip .rm-site:hover { opacity:1; }
      /* category badge */
      .cat-badge { position:absolute; top:6px; right:6px; font-size:8.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:6px; background:rgba(36,31,51,.72); color:#fff; backdrop-filter:blur(3px); }
      .card .cat-inline { font-size:9px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--lav-ink); background:var(--lav); border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:middle; }
      /* quick add to list */
      .quick-add { position:absolute; bottom:11px; right:11px; width:28px; height:28px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--lav-ink); display:grid; place-items:center; cursor:pointer; opacity:0; transition:.15s; }
      .card:hover .quick-add { opacity:1; } .quick-add:hover { background:var(--lav); }
      .quick-add .ic { width:15px; height:15px; }
      .qa-menu { position:absolute; z-index:70; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); padding:6px; min-width:180px; max-height:260px; overflow-y:auto; }
      .qa-menu button { width:100%; display:flex; align-items:center; gap:8px; border:0; background:none; text-align:left; padding:8px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:#4E4960; cursor:pointer; }
      .qa-menu button:hover { background:#F3F1F9; } .qa-menu .qa-on { color:var(--lav-ink); }
      /* bigger list strip cards with a count chip */
      .strip-list { width:172px; } .strip-list .lc { width:172px; height:100px; position:relative; }
      .strip-list .lc .cnt { position:absolute; bottom:7px; right:8px; background:rgba(36,31,51,.72); color:#fff; font-size:10px; font-weight:800; padding:2px 7px; border-radius:99px; }
      .advanced { margin-top:20px; border-top:1px solid var(--line); padding-top:12px; }
      .advanced summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); list-style:none; }
      .advanced summary::-webkit-details-marker { display:none; }
      .advanced summary::before { content:"▸ "; }
      .advanced[open] summary::before { content:"▾ "; }
      .test-res { font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:10px; margin:2px 0 10px; }
      .test-res.good { background:#E8F6F0; color:#2E7D63; }
      .test-res.bad { background:#FDEBEE; color:#C0435A; }
      details.setup { margin:6px 0 10px; }
      details.setup summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--lav-ink); list-style:none; }
      details.setup summary::-webkit-details-marker { display:none; }
      details.setup summary::before { content:"▸ "; }
      details.setup[open] summary::before { content:"▾ "; }
      .code-block { position:relative; background:#1E1A2B; color:#E7E0F5; border-radius:12px; padding:14px 16px; margin:10px 0 6px; overflow-x:auto; }
      .code-block code { white-space:pre; font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; display:block; }
      .code-block .btn { position:absolute; top:10px; right:10px; padding:5px 10px; font-size:11px; }
      .btn.ghost { background:rgba(255,255,255,.14); color:#fff; border:0; }
      .btn.ghost:hover { background:rgba(255,255,255,.24); }
      /* search results filter chips */
      .sr-filters { display:flex; gap:7px; flex-wrap:wrap; margin:0 0 12px; }
      .sr-filters button { border:0; cursor:pointer; border-radius:999px; padding:6px 12px; background:#F2F0F8; color:#7D7989; font-size:12px; font-weight:600; }
      .sr-filters button.active { background:var(--lav); color:var(--lav-ink); }
      .sr-row .cat { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--lav-ink); background:var(--lav); border-radius:5px; padding:1px 6px; margin-left:6px; }

      /* catalog search-to-add results */
      .sr-wrap { margin:6px 0 18px; }
      .sr-head { font-size:12px; color:var(--muted); font-weight:600; margin:0 0 10px; }
      .sr-row { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:8px; box-shadow:var(--shadow); }
      .sr-row .sc { width:46px; height:62px; border-radius:8px; overflow:hidden; flex-shrink:0; background:#EDE8F6; display:grid; place-items:center; color:#fff; font-weight:800; }
      .sr-row .sc img { width:100%; height:100%; object-fit:cover; }
      .sr-row .si { flex:1; min-width:0; } .sr-row .si b { font-size:14px; } .sr-row .si small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
      .sr-row .st { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }

      main { max-width:1140px; margin:auto; padding:26px clamp(16px,4vw,56px) 100px; }
      .view { display:none; animation:fade .28s ease; }
      .view.active { display:block; }
      @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
      h1 { font-size:30px; letter-spacing:-.04em; margin:2px 0 3px; }
      .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
      .section-h { display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 4px; }
      .section-h h2 { font-size:18px; letter-spacing:-.03em; margin:0; }
      .section-h span { font-size:12px; color:var(--muted); }

      /* ---- spotlight ---- */
      .spot { position:relative; border-radius:26px; overflow:hidden; min-height:280px; display:flex; align-items:flex-end; box-shadow:var(--shadow-lg); cursor:pointer; }
      .spot-bg { position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.05); filter:saturate(1.05); transition:opacity .6s; }
      .spot-grad { position:absolute; inset:0; background:linear-gradient(90deg,rgba(20,14,35,.86) 0%,rgba(24,16,42,.62) 45%,rgba(24,16,42,.15) 100%); }
      .spot-fallback { position:absolute; inset:0; background:linear-gradient(120deg,#5C4AA3,#5FB79A); }
      .spot-inner { position:relative; padding:30px clamp(22px,4vw,42px); color:#fff; max-width:640px; }
      .spot-badges { display:flex; gap:8px; margin-bottom:12px; }
      .pill { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.16); backdrop-filter:blur(4px); }
      .pill.new { background:var(--rose); } .pill.soon { background:var(--game); } .pill.game { background:var(--game); }
      .spot h2 { font-size:32px; letter-spacing:-.04em; margin:0 0 6px; line-height:1.05; text-shadow:0 2px 20px rgba(0,0,0,.3); }
      .spot p { font-size:14px; opacity:.9; margin:0 0 20px; }
      .spot-cta { display:flex; gap:10px; }
      .btn-glass { display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; font-weight:700; font-size:13px; border-radius:999px; padding:12px 22px; background:#fff; color:var(--ink); transition:transform .16s, box-shadow .16s; }
      .btn-glass.ghost { background:rgba(255,255,255,.18); color:#fff; backdrop-filter:blur(4px); }
      .btn-glass:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(0,0,0,.22); }
      .dots { position:absolute; bottom:20px; right:24px; display:flex; gap:7px; z-index:3; }
      .dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.4); cursor:pointer; transition:.2s; }
      .dots i.on { background:#fff; width:22px; border-radius:99px; }

      /* ---- poster cards (rows) ---- */
      .poster { width:160px; flex:0 0 auto; cursor:pointer; }
      .poster .art { position:relative; width:160px; height:214px; border-radius:16px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:34px; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s; }
      .poster:hover .art { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
      .poster .art img { width:100%; height:100%; object-fit:cover; }
      .poster .art .flag { position:absolute; top:8px; left:8px; font-size:9px; font-weight:800; letter-spacing:.04em; padding:3px 7px; border-radius:7px; color:#fff; background:var(--rose); box-shadow:0 3px 8px rgba(0,0,0,.2); }
      .poster .art .flag.soon { background:var(--game); }
      .poster .art .prog { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.3); }
      .poster .art .prog i { display:block; height:100%; }
      .poster h4 { font-size:13px; margin:9px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .poster small { font-size:11px; color:var(--muted); }

      /* ---- discovery carousels (fresh recommendations, auto-scrolling) ---- */
      .disco-wrap { position:relative; overflow:hidden; margin:2px -2px 0; }
      .disco-wrap::before, .disco-wrap::after { content:""; position:absolute; top:0; bottom:0; width:46px; z-index:3; pointer-events:none; }
      .disco-wrap::before { left:0; background:linear-gradient(90deg,var(--bg),rgba(251,250,254,0)); }
      .disco-wrap::after { right:0; background:linear-gradient(270deg,var(--bg),rgba(251,250,254,0)); }
      .disco-track { display:flex; gap:14px; width:max-content; padding:8px 2px 16px; will-change:transform; animation:marquee var(--dur,64s) linear infinite; }
      .disco-track.rev { animation-direction:reverse; }
      .disco-wrap:hover .disco-track { animation-play-state:paused; }
      @keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
      @media (prefers-reduced-motion: reduce) { .disco-track { animation:none; width:auto; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin; } .disco-wrap { overflow-x:auto; } }
      .disco { width:154px; flex:0 0 auto; position:relative; }
      .disco .art { position:relative; width:154px; height:206px; border-radius:16px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; font-size:30px; background:linear-gradient(140deg,#B7A2F2,#8AD3C0); box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s; }
      .disco:hover .art { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
      .disco .art img { width:100%; height:100%; object-fit:cover; }
      .disco .art .cat-badge { position:absolute; top:8px; left:8px; font-size:8.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:3px 7px; border-radius:7px; color:#fff; background:rgba(20,14,35,.55); backdrop-filter:blur(3px); z-index:2; }

      .back-btn { display:inline-flex; align-items:center; gap:7px; border:0; background:none; color:var(--lav-ink); font-weight:600; font-size:13px; cursor:pointer; padding:0 0 14px; }

      .crop-scrim { position:fixed; inset:0; background:rgba(40,32,60,.45); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.2s; z-index:90; } .crop-scrim.open { opacity:1; pointer-events:auto; }
      .cropper { position:fixed; top:50%; left:50%; transform:translate(-50%,-46%) scale(.96); opacity:0; pointer-events:none; width:340px; max-width:94vw; background:#fff; border-radius:20px; box-shadow:0 30px 70px rgba(50,36,90,.35); padding:22px; z-index:91; transition:.22s; }
      .cropper.open { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
      .cropper h3 { margin:0 0 2px; font-size:17px; letter-spacing:-.02em; } .crop-hint { margin:0 0 16px; font-size:12px; color:var(--muted); }
      .crop-view { width:280px; height:280px; margin:0 auto; border-radius:16px; overflow:hidden; background:#F0EEF6; touch-action:none; cursor:grab; position:relative; }
      .crop-view.circle { border-radius:50%; } .crop-view:active { cursor:grabbing; }
      .crop-view canvas { display:block; width:280px; height:280px; }
      #crop-zoom { width:100%; margin:16px 0 4px; accent-color:var(--lav-ink); }
      .crop-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
      .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#241F33; color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:80; box-shadow:0 12px 30px rgba(0,0,0,.25); } .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
      input[type=file] { display:none; }
    </style>
  </head>
  <body>
    <header>
      <button class="brand" id="brand" title="Home"><span class="logo"><i></i></span><span class="shine">Yomu</span></button>
      <nav class="tabs" id="nav"></nav>
      <label class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search or add by name…" /></label>
      <div class="top-right">
        <button class="pro-btn" id="go-pro"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="currentColor" stroke="none"/></svg><span id="go-pro-label">Pro</span></button>
        <button class="lang-btn" id="lang-btn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg><b id="lang-code">EN</b></button>
        <button class="icon-btn" id="bell" title="Updates"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button class="avatar" id="avatar" title="Profile"></button>
        <div class="lang-menu" id="lang-menu"></div>
        <div class="menu notif-menu" id="notif-menu"></div>
        <div class="menu" id="profile-menu"></div>
      </div>
    </header>

    <main>
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-library">
        <div id="lib-main">
          <h1 data-t="library"></h1>
          <p class="sub" data-t="librarySub"></p>
          <div id="search-results"></div>
          <div class="stats" id="stats"></div>
          <div class="lists-strip-head"><h2 data-t="lists"></h2><button class="btn sm" id="add-list-inline"></button></div>
          <div class="scroll-x" id="list-strip"></div>
          <div id="sites-block" hidden><div class="lists-strip-head"><h2 id="sites-h">Your sites</h2></div><div class="site-chips" id="site-strip"></div></div>
          <div class="filters" id="filters"></div>
          <div class="grid" id="grid"></div>
        </div>
        <div id="list-detail" hidden></div>
      </section>
      <section class="view" id="view-games"></section>
      <section class="view" id="view-plans"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer"></aside>

    <div class="crop-scrim" id="crop-scrim"></div>
    <div class="cropper" id="cropper" role="dialog" aria-modal="true">
      <h3 id="crop-title">Adjust image</h3>
      <p class="crop-hint">Drag to reposition · slide to zoom</p>
      <div class="crop-view" id="crop-view"><canvas id="crop-canvas" width="280" height="280"></canvas></div>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" />
      <div class="crop-actions">
        <button class="btn" id="crop-file">Choose image</button>
        <span style="flex:1"></span>
        <button class="btn" id="crop-cancel">Cancel</button>
        <button class="btn primary" id="crop-save">Save</button>
      </div>
      <input id="crop-input" type="file" accept="image/*" />
    </div>

    <div class="toast" id="toast"></div>
    <script src="edition.js"></script>
    <script src="library.js"></script>
  </body>
</html>
