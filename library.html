<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dasi — Library</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");
      :root { --ink:#252331; --muted:#8C8999; --lav:#F0EAFF; --green:#6CBE9E; --purple:#A18BE0; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:"DM Sans",sans-serif; color:var(--ink); background:#FCFCFE; }
      header { display:flex; align-items:center; gap:14px; padding:20px clamp(20px,6vw,80px); position:sticky; top:0; background:rgba(252,252,254,.9); backdrop-filter:blur(12px); z-index:5; }
      .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:20px; letter-spacing:-.05em; background:none; border:0; cursor:pointer; padding:0; color:inherit; }
      .logo { width:26px; height:26px; border-radius:10px 10px 10px 4px; background:linear-gradient(145deg,#BCA8F4,#8FD7C2); display:grid; place-items:center; transform:rotate(-8deg); transition:transform .3s; }
      .brand:hover .logo { transform:rotate(0deg) scale(1.08); }
      .logo i { width:10px; height:10px; background:#fff; border-radius:4px; opacity:.9; }
      .shine { background:linear-gradient(100deg,#6C5AA5 30%,#B9A4F0 50%,#6C5AA5 70%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 4s linear infinite; }
      @keyframes shine { to { background-position:200% center; } }
      .search { margin-left:auto; display:flex; align-items:center; gap:8px; background:#F5F4FA; border-radius:999px; padding:9px 14px; width:min(260px,40vw); }
      .search input { border:0; outline:0; background:transparent; width:100%; font:inherit; font-size:13px; color:var(--ink); }
      main { max-width:1080px; margin:auto; padding:26px clamp(20px,6vw,80px) 80px; }
      h1 { font-size:34px; letter-spacing:-.05em; margin:6px 0 4px; }
      .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }

      /* Continue hero */
      .hero { position:relative; display:flex; gap:20px; align-items:center; border-radius:22px; padding:22px; margin:0 0 26px; overflow:hidden; background:linear-gradient(120deg,#F3EEFF,#EAF6F1); box-shadow:0 14px 40px rgba(92,74,140,.10); }
      .hero-cover { width:96px; height:128px; border-radius:14px; overflow:hidden; flex-shrink:0; display:grid; place-items:center; color:#fff; font-weight:800; font-size:34px; box-shadow:0 10px 26px rgba(92,74,140,.22); }
      .hero-cover img { width:100%; height:100%; object-fit:cover; }
      .hero-body { min-width:0; flex:1; }
      .hero-eyebrow { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8A78C4; margin:0 0 6px; }
      .hero-title { font-size:22px; letter-spacing:-.03em; margin:0 0 4px; }
      .hero-marker { font-size:13px; color:#6f6b7d; margin:0 0 12px; }
      .hero .bar { max-width:340px; }
      .resume { display:inline-flex; align-items:center; gap:8px; margin-top:14px; border:0; cursor:pointer; text-decoration:none; font:inherit; font-weight:700; font-size:13px; color:#fff; background:linear-gradient(135deg,#8E7BE0,#6CBE9E); border-radius:999px; padding:11px 20px; box-shadow:0 8px 20px rgba(120,100,200,.28); transition:transform .18s, box-shadow .18s; }
      .resume:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(120,100,200,.36); }

      /* stat chips */
      .stats { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 24px; }
      .chip { background:#fff; border-radius:15px; padding:12px 18px; box-shadow:0 8px 22px rgba(92,74,140,.06); min-width:96px; }
      .chip b { display:block; font-size:22px; letter-spacing:-.03em; }
      .chip span { font-size:11px; color:var(--muted); font-weight:600; }

      .tabs { display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
      .tabs button { border:0; cursor:pointer; border-radius:999px; padding:9px 15px; background:#F4F3F8; color:#817D8F; font:inherit; font-size:12px; font-weight:600; transition:background .15s,color .15s; }
      .tabs button.active { background:#EDE6FF; color:#705BBA; }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
      .item { position:relative; display:flex; gap:13px; background:#fff; border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(92,74,140,.06); transition:transform .18s, box-shadow .18s; }
      .item:hover { transform:translateY(-3px); box-shadow:0 16px 34px rgba(92,74,140,.12); }
      .cover { width:52px; height:68px; border-radius:9px; overflow:hidden; display:grid; place-items:center; color:#fff; font-weight:800; flex-shrink:0; }
      .cover img { width:100%; height:100%; object-fit:cover; }
      .item h3 { font-size:14px; margin:0; padding-right:22px; }
      .item p { font-size:11px; color:var(--muted); margin:5px 0 9px; }
      .bar { height:5px; background:#EDE8F6; border-radius:99px; overflow:hidden; }
      .bar i { display:block; height:100%; border-radius:99px; }
      .item small { display:block; font-size:10px; color:#9E97A7; margin-top:6px; }
      .fav { position:absolute; top:12px; right:12px; border:0; background:none; cursor:pointer; font-size:16px; line-height:1; color:#D6D0E4; transition:transform .15s, color .15s; padding:0; }
      .fav:hover { transform:scale(1.2); }
      .fav.on { color:#F4B740; }
      .rate { display:flex; gap:2px; margin-top:8px; }
      .rate span { cursor:pointer; font-size:13px; color:#DDD8E8; transition:color .12s, transform .12s; }
      .rate span:hover { transform:scale(1.2); }
      .rate span.on { color:#F4B740; }
      .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
      .tag { font-size:9px; font-weight:700; letter-spacing:.03em; background:#F0EAFF; color:#7E6BC0; border-radius:6px; padding:2px 7px; }
      .item-actions { display:flex; flex-direction:column; gap:6px; margin-left:auto; align-self:flex-start; }
      .item-actions a, .item-actions button { border:0; cursor:pointer; font:inherit; font-size:11px; border-radius:8px; padding:6px 10px; text-align:center; text-decoration:none; }
      .open { background:#EDE6FF; color:#705BBA; }
      .del { background:#FBEEF1; color:#C7788B; }
      .empty { text-align:center; color:var(--muted); padding:60px 0; }
      .group-head { grid-column:1/-1; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#9A93AC; margin:14px 0 2px; }
      .sites { margin:34px 0 8px; }
      .sites h2 { font-size:16px; margin:0 0 12px; }
      .site-list { display:flex; gap:10px; flex-wrap:wrap; }
      .site-list a { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); background:#F5F4FA; border-radius:12px; padding:10px 14px; font-size:12px; font-weight:600; }
      .tool-btn { border:0; cursor:pointer; font:inherit; font-size:12px; font-weight:600; border-radius:999px; padding:9px 14px; background:#F0EAFF; color:#705BBA; transition:background .15s; }
      .tool-btn:hover { background:#E3D6FF; }
    </style>
  </head>
  <body>
    <header>
      <button class="brand" id="brand" title="Home"><span class="logo"><i></i></span><span class="shine">Dasi</span></button>
      <div class="search"><span>🔍</span><input id="q" placeholder="Search a title" /></div>
      <button id="export" class="tool-btn">Export</button>
      <button id="import" class="tool-btn">Import</button>
      <input id="file" type="file" accept="application/json,.json" hidden />
    </header>
    <main>
      <h1>Your library</h1>
      <p class="sub">Everything you saved, kept on this device.</p>
      <section id="hero" hidden></section>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs">
        <button data-f="all" class="active">All</button>
        <button data-f="reading">Reading</button>
        <button data-f="watching">Watching</button>
        <button data-f="favorites">Favorites</button>
      </div>
      <div class="grid" id="grid"></div>
      <section class="sites" id="sites-wrap" hidden>
        <h2>Your sites</h2>
        <div class="site-list" id="sites"></div>
      </section>
    </main>
    <script src="library.js"></script>
  </body>
</html>
