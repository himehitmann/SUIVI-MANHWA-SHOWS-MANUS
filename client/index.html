<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="yomu-api" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Yomu — Track & Resume Manga, Webtoons, Anime, Series & Games</title>
    <meta name="description" content="Yomu remembers where you stopped in any manga, webtoon, anime, series, film or game. One-click save, one library for everything, resume anywhere — with built-in page translation. Private by design." />
    <meta name="theme-color" content="#8FD7C2" />
    <meta name="application-name" content="Yomu" />
    <meta name="author" content="Yomu" />

    <!-- Canonical (set VITE_SITE_URL at build; defaults below) -->
    <link rel="canonical" href="https://yomu.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yomu" />
    <meta property="og:title" content="Yomu — one library for everything you read & watch" />
    <meta property="og:description" content="Track and resume manga, webtoons, anime, series, films and games in one place. One-click save, built-in translation, private by design." />
    <meta property="og:url" content="https://yomu.app/" />
    <meta property="og:image" content="https://yomu.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yomu — track & resume manga, webtoons, anime, series, films and games." />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yomu — one library for everything you read & watch" />
    <meta name="twitter:description" content="Track and resume manga, webtoons, anime, series, films and games in one place. One-click save, built-in translation, private by design." />
    <meta name="twitter:image" content="https://yomu.app/og-image.png" />
    <meta name="twitter:image:alt" content="Yomu — universal reading & watching tracker." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
