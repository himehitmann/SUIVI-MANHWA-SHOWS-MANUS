# Prepared deployment proposal. Creating these resources is billable.
# Automatic application deployments are disabled until production recovery is verified.
services:
  - type: web
    name: yomu
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.19.0 build
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SYNC_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yomu-db
          property: connectionString
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
databases:
  - name: yomu-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
