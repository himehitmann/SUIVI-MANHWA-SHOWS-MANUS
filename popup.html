<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Yomu</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");
      :root { --ink:#252331; --muted:#8C8999; --lav:#F0EAFF; --mint:#E9F8F0; --green:#6CBE9E; --purple:#A18BE0; }
      * { box-sizing:border-box; }
      body { width:372px; margin:0; padding:12px; font-family:"DM Sans",sans-serif; color:var(--ink); background:#FCFCFE; }
      .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.05em; margin-bottom:10px; cursor:pointer; background:none; border:0; padding:0; color:var(--ink); }
      .logo { width:26px; height:26px; border-radius:10px 10px 10px 4px; background:linear-gradient(145deg,#BCA8F4,#8FD7C2); display:grid; place-items:center; transform:rotate(-8deg); box-shadow:0 5px 12px rgba(145,121,220,.2); }
      .logo i { width:10px; height:10px; background:#fff; border-radius:4px; opacity:.9; }
      .shine { font-weight:800; letter-spacing:-.05em; color:#6C5AA5; background:linear-gradient(100deg,#6C5AA5 0%,#6C5AA5 42%,#EFE7FF 50%,#6C5AA5 58%,#6C5AA5 100%); background-size:260% 100%; background-position:120% center; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:sheen 4.5s ease-in-out infinite; }
      @keyframes sheen { 0%,12% { background-position:120% center; } 55%,100% { background-position:-60% center; } }
      .brand .tag { margin-left:auto; font-size:9px; font-weight:800; letter-spacing:.06em; color:#5E9D80; background:var(--mint); border-radius:999px; padding:4px 8px; display:flex; align-items:center; gap:5px; }
      .brand .tag i { width:6px; height:6px; border-radius:50%; background:#6CBE9E; }
      .eyebrow { font-size:10px; letter-spacing:.09em; color:#9B86DA; font-weight:700; margin:0 0 6px; }
      .card { background:#fff; border-radius:16px; padding:13px; box-shadow:0 8px 24px rgba(92,74,140,.08); }
      .detected { display:flex; gap:12px; }
      .cover { width:48px; height:64px; border-radius:9px; flex:none; overflow:hidden; background:linear-gradient(145deg,#EDE6FF,#E4F5EC); display:grid; place-items:center; }
      .cover img { width:100%; height:100%; object-fit:cover; display:block; }
      .cover span { font-size:22px; font-weight:800; color:#fff; }
      .info { min-width:0; flex:1; }
      .kind { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); display:flex; align-items:center; gap:5px; }
      .kind b { width:6px; height:6px; border-radius:50%; background:var(--green); }
      .kind.watching b { background:var(--purple); }
      .title { font-size:16px; letter-spacing:-.02em; margin:5px 0 4px; line-height:1.2; }
      .marker { font-size:12px; color:#6D6677; font-weight:600; }
      .time { font-size:12px; color:var(--purple); font-weight:700; margin-top:3px; }
      .conf { font-size:11px; color:#B98A5A; margin:9px 0 0; display:none; }
      .conf.show { display:block; }
      .prev { display:none; align-items:flex-start; gap:8px; margin-top:12px; padding:10px 12px; background:#FFF6EC; border-radius:10px; font-size:12px; color:#9A6A3B; }
      .prev.show { display:flex; }
      .prev b { display:block; color:#7A5326; font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
      button { font:inherit; border:0; cursor:pointer; border-radius:10px; font-weight:700; }
      .actions { display:flex; gap:8px; margin-top:11px; }
      .primary { flex:1; background:#6CBE9E; color:#fff; padding:11px; font-size:13px; }
      .primary:hover { background:#4CA37E; }
      .primary.warn { background:#E0894A; } .primary.warn:hover { background:#C9773A; }
      .primary:disabled { opacity:.5; cursor:default; }
      .secondary { background:#F0EAFF; color:#62519B; padding:11px 13px; font-size:13px; display:flex; align-items:center; gap:6px; }
      .secondary:hover { background:#E3D6FF; }
      .row { display:flex; gap:8px; margin-top:8px; }
      .row button { flex:1; background:#F5F4FA; color:#6D6677; padding:9px; font-size:11px; display:flex; align-items:center; justify-content:center; gap:6px; }
      .row button:hover { background:#EDE6FF; color:#705BBA; }
      .tools { margin-top:9px; padding:10px 12px; background:#F7F5FC; border-radius:12px; }
      .tools-title { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:7px; }
      .speed-line { display:flex; align-items:center; justify-content:space-between; font-size:12px; }
      .speed-actions { display:flex; align-items:center; gap:9px; }
      .step { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:#E4D9FA; color:#6F5CBD; }
      .step:hover { background:#A18BE0; color:#fff; }
      .speed-val { min-width:40px; text-align:center; font-weight:700; }
      .pip { width:100%; margin-top:8px; padding:8px; border-radius:999px; background:#A18BE0; color:#fff; font-size:11px; }
      .pip:disabled { opacity:.5; cursor:default; }
      .share { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid #F0EEF5; }
      .stars { display:inline-flex; cursor:pointer; gap:2px; }
      .stars span { font-size:17px; color:#E4DFEA; transition:transform .12s, color .12s; line-height:1; }
      .stars span.on { color:#FFB23E; }
      .stars:hover span { transform:scale(1.06); }
      .stars span.pop { transform:scale(1.35); }
      .speed-input { width:52px; text-align:center; font:inherit; font-weight:700; font-size:12px; color:var(--ink); border:0; background:#fff; border-radius:8px; padding:5px 4px; outline:0; box-shadow:inset 0 0 0 1px #E4D9FA; }
      .speed-input::-webkit-inner-spin-button { opacity:.4; }
      .speed-x { font-size:11px; color:#9C98A6; margin-left:-2px; }
      .share-icons { display:flex; gap:6px; }
      .sh { width:30px; height:30px; border-radius:50%; background:#F5F4FA; display:grid; place-items:center; transition:transform .15s, background .15s; padding:0; }
      .sh svg { width:15px; height:15px; fill:#6D6677; transition:fill .15s; }
      .sh:hover { transform:translateY(-2px) scale(1.05); }
      .sh.x:hover{background:#111} .sh.fb:hover{background:#1877F2} .sh.wa:hover{background:#25D366} .sh.rd:hover{background:#FF4500} .sh.cp:hover{background:#7C5CD6}
      .sh:hover svg { fill:#fff; }
      .foot { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:10px; margin-top:10px; }
      .foot button { background:none; color:#9892A5; font-size:10px; padding:0; }
      .foot button:hover { color:#705BBA; text-decoration:underline; }
      .tr-line { display:flex; gap:8px; align-items:center; }
      .tr-line select { flex:1; font:inherit; font-size:12px; border:0; background:#fff; border-radius:8px; padding:8px 9px; color:var(--ink); box-shadow:inset 0 0 0 1px #E4D9FA; outline:0; }
      .tr-go { background:#A18BE0; color:#fff; padding:8px 12px; font-size:12px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
      .tr-go:hover { background:#8A72D4; }
      .tr-go:disabled { opacity:.5; cursor:default; }
      .tr-status { font-size:11px; color:var(--muted); margin-top:8px; min-height:14px; }
      .tr-status.up { color:#B98A5A; }
      @media (prefers-reduced-motion: reduce) { .shine { animation:none; -webkit-text-fill-color:#6C5AA5; } }
    </style>
  </head>
  <body>
    <button class="brand" id="brand" title="Open Yomu">
      <span class="logo"><i></i></span><span class="shine">Yomu</span>
      <span class="tag"><i></i> Local</span>
    </button>

    <p class="eyebrow">ON THIS PAGE</p>
    <div class="card">
      <div class="detected">
        <div class="cover" id="cover" data-initial="D"><span id="coverInitial">D</span></div>
        <div class="info">
          <div class="kind" id="kind"><b></b> <span id="kindLabel">Detecting…</span></div>
          <h1 class="title" id="title">Reading the page…</h1>
          <div class="marker" id="marker">Checking title, chapter and player…</div>
          <div class="time" id="time" style="display:none"></div>
        </div>
      </div>

      <p class="conf" id="conf"></p>

      <div class="prev" id="prev">
        <div>
          <b>Already saved</b>
          <span id="prevText"></span>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="save" disabled>Save my position</button>
        <button class="secondary" id="open" title="Open the Yomu app"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg> Open Yomu</button>
      </div>

      <div class="row">
        <button id="save-site"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.9 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg> Save this site</button>
      </div>

      <div class="tools" id="video-tools">
        <div class="tools-title">Video tools</div>
        <div class="speed-line">
          <span>Playback speed</span>
          <div class="speed-actions">
            <button class="step" id="slower">−</button>
            <input class="speed-input" id="speed-input" type="number" min="0.25" max="3" step="0.25" value="1" aria-label="Playback speed" />
            <span class="speed-x">×</span>
            <button class="step" id="faster">＋</button>
          </div>
        </div>
        <button class="pip" id="pip">Open Picture-in-Picture</button>
      </div>

      <div class="tools" style="margin-top:8px">
        <div class="tools-title">Translate this page</div>
        <div class="tr-line">
          <select id="tr-lang" aria-label="Target language"></select>
          <button id="tr-go" class="tr-go"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 5-3 8-6 9"/><path d="M5 11c2 2 5 3 7 3"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg> Translate</button>
        </div>
        <div class="tr-status" id="tr-status"></div>
      </div>

      <div class="share">
        <div class="stars" id="stars" title="Rate Yomu 5★ on the Chrome Web Store" role="button" aria-label="Rate on the Chrome Web Store">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
        <div class="share-icons">
          <button class="sh x" id="sh-x" title="Share on X" aria-label="Share on X"><svg viewBox="0 0 24 24"><path d="M18.24 2H21.5l-7.5 8.57L22.5 22h-6.6l-5.17-6.76L4.8 22H1.54l8.02-9.17L1.5 2h6.77l4.67 6.18L18.24 2Zm-1.16 18h1.83L7.02 3.9H5.06L17.08 20Z"/></svg></button>
          <button class="sh fb" id="sh-fb" title="Share on Facebook" aria-label="Share on Facebook"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12Z"/></svg></button>
          <button class="sh wa" id="sh-wa" title="Share on WhatsApp" aria-label="Share on WhatsApp"><svg viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.97L2 22l5.16-1.35A9.9 9.9 0 1 0 12.04 2Zm0 1.8a8.1 8.1 0 0 1 5.73 13.83A8.1 8.1 0 0 1 7.5 18.8l-.36-.21-3.06.8.82-2.98-.24-.38A8.1 8.1 0 0 1 12.04 3.8Zm-2.9 4.02c-.15 0-.4.06-.6.29-.2.22-.78.76-.78 1.86s.8 2.16.91 2.31c.11.15 1.57 2.5 3.9 3.4 1.94.75 2.34.6 2.76.56.42-.04 1.36-.55 1.55-1.09.19-.53.19-.99.13-1.09-.06-.1-.2-.15-.42-.26-.22-.11-1.36-.67-1.57-.75-.21-.08-.36-.11-.51.11-.15.22-.58.75-.72.9-.13.15-.26.17-.48.06-.22-.11-.94-.35-1.79-1.11-.66-.59-1.11-1.32-1.24-1.54-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.26-.69-1.72-.18-.44-.36-.38-.5-.39l-.42-.01Z"/></svg></button>
          <button class="sh rd" id="sh-rd" title="Share on Reddit" aria-label="Share on Reddit"><svg viewBox="0 0 24 24"><path d="M22 11.6a2.1 2.1 0 0 0-3.55-1.5 10.3 10.3 0 0 0-5.2-1.64l.88-4.15 2.9.62a1.5 1.5 0 1 0 .17-.98l-3.3-.7a.5.5 0 0 0-.59.38l-1 4.7a10.4 10.4 0 0 0-5.32 1.64 2.1 2.1 0 1 0-2.3 3.42 4.2 4.2 0 0 0-.04.66c0 3.3 3.85 5.98 8.6 5.98s8.6-2.68 8.6-5.98a4 4 0 0 0-.04-.65A2.1 2.1 0 0 0 22 11.6ZM7.6 13.1a1.4 1.4 0 1 1 2.8 0 1.4 1.4 0 0 1-2.8 0Zm7.86 3.68c-.98.98-3.9.98-4.9 0a.4.4 0 0 1 .56-.56c.65.64 3.02.65 3.77 0a.4.4 0 1 1 .57.56Zm-.06-2.28a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8Z"/></svg></button>
          <button class="sh cp" id="sh-cp" title="Copy share link" aria-label="Copy link"><svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 0 1.42 0l4.24-4.24a3 3 0 1 0-4.24-4.25l-1.2 1.2a1 1 0 1 0 1.42 1.42l1.2-1.2a1 1 0 1 1 1.42 1.41l-4.25 4.24a1 1 0 0 0 0 1.42Zm2.8-2.8a1 1 0 0 0-1.42 0L7.74 14.84a1 1 0 1 1-1.42-1.42l4.25-4.24a1 1 0 1 0-1.42-1.42L4.9 12a3 3 0 1 0 4.25 4.24l4.24-4.24a1 1 0 0 0 0-1.42Z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button id="sync-link">Sync (optional)</button>
      <span style="opacity:.7">Ctrl+Shift+S</span>
    </div>
    <script src="edition.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
